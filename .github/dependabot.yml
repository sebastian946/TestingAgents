# Dependabot (WTA-30): weekly PRs for vulnerable or outdated dependencies, grouped so a
# release is one PR per ecosystem instead of twenty. Security updates arrive as soon as the
# advisory is published, whatever the schedule.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
