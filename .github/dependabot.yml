# Dependabot (WTA-30): weekly PRs for vulnerable or outdated dependencies, grouped so a
# release is one PR per ecosystem instead of twenty. Security updates arrive as soon as the
# advisory is published, whatever the schedule.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
    ignore:
      # The project is tested on Python 3.12 (pyproject, uv.lock); a major/minor bump of the
      # base image is a deliberate upgrade, not a dependency update
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # The frontend build is tested on an LTS Node; a major bump is a deliberate upgrade
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
