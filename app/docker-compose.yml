services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:   # "running" is not "ready": api and worker wait for this
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      target: api
    container_name: api
    restart: unless-stopped
    # Apply pending migrations, then serve (WTA-4). A fresh database gets every migration, an
    # existing one only what is new, so a fresh clone and an upgrade both work with no manual step
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - reports_data:/app/reports   # same files as the worker, so the API can serve the reports
    env_file: ../.env
    environment:
      ENDPOINT: postgres   # inside Docker, hosts are the service names
      REDIS_HOST: redis
      DB_PORT: 5432        # the container port, not the 5433 published on your machine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/Health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      target: worker
    container_name: worker
    restart: unless-stopped
    init: true        # reaps zombie Chromium processes left behind by crashed tasks
    shm_size: 1gb     # Chromium crashes with Docker's default 64 MB of shared memory
    volumes:
      - reports_data:/app/reports   # screenshots and reports survive container restarts
    env_file: ../.env
    environment:
      ENDPOINT: postgres   # inside Docker, hosts are the service names
      REDIS_HOST: redis
      DB_PORT: 5432        # the container port, not the 5433 published on your machine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy   # the api creates the tables the worker writes to


volumes:
  postgres_data:
  redis_data:
  reports_data:
